name: Release Version Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from version.go
        id: file_version
        run: |
          VERSION=$(make version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in version.go: $VERSION"

      - name: Extract version from branch name
        id: branch_version
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^(release|version)/(.+)$ ]]; then
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "Version from branch: ${BASH_REMATCH[2]}"
          else
            echo "version=NOT_A_RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Not a release/version branch, skipping check"
          fi

      - name: Compare versions
        run: |
          FILE_VERSION="${{ steps.file_version.outputs.version }}"
          BRANCH_VERSION="${{ steps.branch_version.outputs.version }}"

          if [ "$BRANCH_VERSION" = "NOT_A_RELEASE_BRANCH" ]; then
            echo "Branch is not release/* or version/*; version check skipped"
            exit 0
          fi

          if [ "$FILE_VERSION" != "$BRANCH_VERSION" ]; then
            echo "ERROR: version.go ($FILE_VERSION) does not match branch version ($BRANCH_VERSION)"
            exit 1
          fi

          echo "Versions match: $FILE_VERSION"
