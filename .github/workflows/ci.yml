name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests and vet
        run: make test

  version-check:
    name: Release version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from version.go
        id: file_version
        run: |
          set -euo pipefail
          VERSION=$(grep 'const Version' src/internal/version/version.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not parse version from src/internal/version/version.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in version.go: $VERSION"

      - name: Extract version from branch name
        id: branch_version
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^(release|version)/(.+)$ ]]; then
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "Version from branch: ${BASH_REMATCH[2]}"
          else
            echo "version=NOT_A_RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Not a release/version branch, skipping check"
          fi

      - name: Compare versions
        run: |
          FILE_VERSION="${{ steps.file_version.outputs.version }}"
          BRANCH_VERSION="${{ steps.branch_version.outputs.version }}"

          if [ "$BRANCH_VERSION" = "NOT_A_RELEASE_BRANCH" ]; then
            echo "Branch is not release/* or version/*; version check skipped"
            exit 0
          fi

          if [ "$FILE_VERSION" != "$BRANCH_VERSION" ]; then
            echo "ERROR: version.go ($FILE_VERSION) does not match branch version ($BRANCH_VERSION)"
            exit 1
          fi

          echo "Versions match: $FILE_VERSION"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker is available
        run: docker info

      - name: Run integration tests
        run: make integration-test
